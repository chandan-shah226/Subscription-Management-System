<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Management System — Brightloop Software</title>
    <!-- Core Application Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top Application Navigation Header -->
    <header class="app-header">
        <div class="header-container">
            <div class="brand-section">
                <a href="#/dashboard" class="logo">Brightloop <span>Subscriptions</span></a>
                <span id="api-status" class="status-indicator">Checking API...</span>
            </div>
            
            <!-- Dynamic Navigation Links (Updated based on role) -->
            <nav id="app-navigation" class="app-nav">
                <!-- Injected dynamically by AuthManager -->
            </nav>

            <!-- User Menu / Auth Controls -->
            <div id="user-menu" class="user-menu">
                <!-- Injected dynamically by AuthManager -->
            </div>
        </div>
    </header>

    <!-- Main Dynamic Application Container -->
    <main id="app" class="main-content">
        <div id="view-container" class="view-container">
            <!-- Active view rendered here by Router -->
        </div>
    </main>

    <!-- Application Footer -->
    <footer class="app-footer">
        <div class="footer-container">
            <p>&copy; 2026 Brightloop Software — Unified Subscription Management Platform (All Modules 1–8).</p>
            <p class="text-xs text-muted">Python Flask • SQLite • SQLAlchemy • JWT • Single Page Application</p>
        </div>
    </footer>

    <!-- Vanilla JavaScript Application Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/views/authView.js"></script>
    <script src="js/views/dashboardView.js"></script>
    <script src="js/views/userView.js"></script>
    <script src="js/views/productPlanView.js"></script>
    <script src="js/views/quotationView.js"></script>
    <script src="js/views/subscriptionView.js"></script>
    <script src="js/views/invoiceView.js"></script>
    <script src="js/views/paymentView.js"></script>
    <script src="js/views/discountView.js"></script>
    <script src="js/views/financeView.js"></script>
    <script src="js/router.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
