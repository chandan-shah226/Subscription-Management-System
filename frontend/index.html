<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Management System</title>
    <!-- Core Application Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top Navigation / Application Header -->
    <header class="app-header">
        <div class="header-container">
            <h1 class="logo">Subscription Manager</h1>
            <nav class="nav-placeholder">
                <!-- Navigation links will be added here as features are developed -->
                <span class="badge">Development Skeleton</span>
            </nav>
        </div>
    </header>

    <!-- Main Content Container: Placeholder for views (Dashboard, Products, Plans, Invoices, etc.) -->
    <main id="app" class="main-content">
        <section class="welcome-card">
            <h2>Subscription Management System</h2>
            <p>Welcome to the project skeleton. The frontend is built using standard HTML5, CSS3, and Vanilla JavaScript.</p>
            
            <!-- API Connectivity Status Indicator -->
            <div class="api-status-box">
                <strong>API Status:</strong>
                <span id="api-status" class="status-indicator">Checking connection...</span>
            </div>
        </section>

        <!-- Placeholder section ready for modular frontend views -->
        <section id="view-container" class="view-container">
            <!-- Feature-specific UI components will be rendered here dynamically or statically -->
        </section>
    </main>

    <!-- Application Footer -->
    <footer class="app-footer">
        <p>&copy; 2026 Subscription Management System. Initial Project Skeleton.</p>
    </footer>

    <!-- Core Application Logic (Vanilla JavaScript) -->
    <script src="js/main.js"></script>
</body>
</html>
